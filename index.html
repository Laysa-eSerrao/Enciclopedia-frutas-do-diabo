<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enciclopédia das Frutas do Diabo – Grand Line Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0812;
  --surface:#120f1e;
  --surface2:#1a1630;
  --border:#2a2445;
  --text:#e8e0f0;
  --muted:#7a6e8a;
  --param:#c084fc;
  --param-bg:rgba(192,132,252,0.1);
  --param-border:rgba(192,132,252,0.3);
  --zoan:#fb923c;
  --zoan-bg:rgba(251,146,60,0.1);
  --zoan-border:rgba(251,146,60,0.3);
  --logia:#38bdf8;
  --logia-bg:rgba(56,189,248,0.1);
  --logia-border:rgba(56,189,248,0.3);
  --accent:#a855f7;
}

html { scroll-behavior: smooth; }

body{
  font-family:'Crimson Pro',Georgia,serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(168,85,247,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 90% 80%, rgba(56,189,248,0.06) 0%, transparent 60%);
}

header{
  text-align:center;
  padding:64px 24px 40px;
  position:relative;
}
header::after{
  content:'';
  display:block;
  width:160px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  margin:28px auto 0;
}

.title-eyebrow{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:0.35em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:14px;
}

h1{
  font-family:'Cinzel',serif;
  font-size:clamp(32px,7vw,60px);
  font-weight:800;
  background:linear-gradient(135deg,#e8d5ff 0%,#a855f7 40%,#38bdf8 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.1;
  letter-spacing:0.02em;
}

.subtitle{
  font-size:18px;
  color:var(--muted);
  font-style:italic;
  margin-top:12px;
}

.controls{
  max-width:960px;
  margin:0 auto 24px;
  padding:0 24px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}

.search-wrap{
  flex:1;
  min-width:240px;
  position:relative;
}

.search-wrap svg{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  pointer-events:none;
}

input[type=search]{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px 16px 13px 46px;
  color:var(--text);
  font-family:'Crimson Pro',serif;
  font-size:16px;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
input[type=search]:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(168,85,247,0.1);
}
input[type=search]::placeholder{color:var(--muted)}
input[type=search]::-webkit-search-cancel-button{display:none}

.filters{display:flex;gap:8px;flex-wrap:wrap}

.filter-btn{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:0.08em;
  padding:10px 20px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  cursor:pointer;
  transition:all 0.2s;
}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active-all{border-color:var(--accent);background:rgba(168,85,247,0.15);color:var(--param)}
.filter-btn.active-param{border-color:var(--param-border);background:var(--param-bg);color:var(--param)}
.filter-btn.active-zoan{border-color:var(--zoan-border);background:var(--zoan-bg);color:var(--zoan)}
.filter-btn.active-logia{border-color:var(--logia-border);background:var(--logia-bg);color:var(--logia)}

.count{
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:0.15em;
  color:var(--muted);
  max-width:960px;
  margin:0 auto 20px;
  padding:0 24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px;
  max-width:960px;
  margin:0 auto;
  padding:0 24px 80px;
}

.card{
  background:var(--surface);
  border-radius:16px;
  border:1px solid var(--border);
  padding:24px;
  cursor:pointer;
  transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;
  position:relative;
  overflow:hidden;
  animation:fadeIn 0.35s ease both;
}
.card::before{
  content:'';
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 0.3s;
  pointer-events:none;
}
.card.paramecia::before{background:radial-gradient(ellipse at top left,rgba(192,132,252,0.1),transparent 70%)}
.card.zoan::before{background:radial-gradient(ellipse at top left,rgba(251,146,60,0.1),transparent 70%)}
.card.logia::before{background:radial-gradient(ellipse at top left,rgba(56,189,248,0.1),transparent 70%)}
.card:hover{transform:translateY(-4px)}
.card:hover::before{opacity:1}
.card.paramecia:hover{border-color:var(--param-border);box-shadow:0 8px 32px rgba(192,132,252,0.15)}
.card.zoan:hover{border-color:var(--zoan-border);box-shadow:0 8px 32px rgba(251,146,60,0.15)}
.card.logia:hover{border-color:var(--logia-border);box-shadow:0 8px 32px rgba(56,189,248,0.15)}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}

.fruit-icon{
  font-size:36px;
  line-height:1;
}

.type-badge{
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:0.12em;
  padding:5px 12px;
  border-radius:20px;
  font-weight:600;
}
.paramecia .type-badge{background:var(--param-bg);color:var(--param);border:1px solid var(--param-border)}
.zoan .type-badge{background:var(--zoan-bg);color:var(--zoan);border:1px solid var(--zoan-border)}
.logia .type-badge{background:var(--logia-bg);color:var(--logia);border:1px solid var(--logia-border)}

.fruit-name{
  font-family:'Cinzel',serif;
  font-size:14px;
  font-weight:600;
  color:var(--text);
  margin-bottom:4px;
  line-height:1.3;
}
.fruit-name-pt{
  font-size:13px;
  color:var(--muted);
  font-style:italic;
  margin-bottom:12px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.user-dot{
  width:6px;height:6px;
  border-radius:50%;
  flex-shrink:0;
}
.paramecia .user-dot{background:var(--param)}
.zoan .user-dot{background:var(--zoan)}
.logia .user-dot{background:var(--logia)}
.user-name{font-size:13px;color:var(--muted)}
.user-name strong{color:var(--text);font-weight:400}

.desc{font-size:14px;color:var(--muted);line-height:1.7;font-style:italic}

.empty{
  text-align:center;
  padding:100px 24px;
  color:var(--muted);
  grid-column:1/-1;
  font-size:20px;
  font-style:italic;
}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(5,3,12,0.88);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity 0.25s;
}
.modal-overlay.open{opacity:1;pointer-events:all}

.modal{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:24px;
  padding:40px;
  max-width:540px;
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  position:relative;
  transform:translateY(20px) scale(0.98);
  transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}

.modal-close{
  position:absolute;top:20px;right:20px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);width:34px;height:34px;
  border-radius:10px;cursor:pointer;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
  line-height:1;
}
.modal-close:hover{color:var(--text);border-color:var(--accent)}

.modal-icon{
  font-size:64px;
  text-align:center;
  margin-bottom:18px;
  filter:drop-shadow(0 0 24px rgba(168,85,247,0.4));
}

.modal h2{
  font-family:'Cinzel',serif;
  font-size:24px;font-weight:600;
  text-align:center;margin-bottom:5px;
  color:var(--text);
}
.modal-pt{
  text-align:center;
  font-style:italic;
  color:var(--muted);
  margin-bottom:22px;
  font-size:16px;
}

.modal-badge-row{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:28px;
  flex-wrap:wrap;
}

.divider{
  height:1px;
  background:var(--border);
  margin:20px 0;
}

.modal-section{margin-bottom:20px}
.modal-label{
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:0.22em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:8px;
}
.modal-text{font-size:16px;line-height:1.7;color:var(--text)}

.power-bar{margin-top:10px}
.power-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.power-label{font-size:13px;color:var(--muted);width:90px;flex-shrink:0}
.power-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.power-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1)}
.paramecia-fill{background:linear-gradient(90deg,#9333ea,#c084fc)}
.zoan-fill{background:linear-gradient(90deg,#ea580c,#fb923c)}
.logia-fill{background:linear-gradient(90deg,#0284c7,#38bdf8)}
.power-value{font-size:12px;color:var(--muted);width:30px;text-align:right}

.weakness-pill{
  display:inline-block;
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.25);
  color:#f87171;
  font-size:12px;
  padding:4px 12px;
  border-radius:20px;
  margin:3px;
}

/* Animação */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

/* Scrollbar modal */
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-track{background:transparent}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Responsivo */
@media(max-width:600px){
  h1{font-size:32px}
  .controls{flex-direction:column}
  .search-wrap{min-width:100%}
  .modal{padding:28px 20px;max-height:95vh}
  .modal h2{font-size:20px}
}
</style>
</head>
<body>

<header>
  <div class="title-eyebrow">Grand Line Archives</div>
  <h1>Enciclopédia das<br>Frutas do Diabo</h1>
  <p class="subtitle">O conhecimento proibido do Grand Line</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" id="search" placeholder="Buscar fruta, usuário ou habilidade..." oninput="render()">
  </div>
  <div class="filters">
    <button class="filter-btn active-all" data-type="all" onclick="setFilter('all')">Todas</button>
    <button class="filter-btn" data-type="Paramecia" onclick="setFilter('Paramecia')">Paramecia</button>
    <button class="filter-btn" data-type="Zoan" onclick="setFilter('Zoan')">Zoan</button>
    <button class="filter-btn" data-type="Logia" onclick="setFilter('Logia')">Logia</button>
  </div>
</div>

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<div class="modal-overlay" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal"></div>
</div>

let currentFilter = 'all';

function typeClass(t) {
  if(t.includes('Paramecia')) return 'paramecia';
  if(t.includes('Zoan')) return 'zoan';
  return 'logia';
}
function typeLabel(t) {
  if(t.includes('Paramecia')) return t === 'Paramecia' ? 'Paramecia' : t;
  if(t.includes('Zoan')) return t;
  return 'Logia';
}

function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
    if(b.dataset.type === type) {
      if(type === 'all') b.classList.add('active-all');
      else if(type === 'Paramecia') b.classList.add('active-param');
      else if(type === 'Zoan') b.classList.add('active-zoan');
      else if(type === 'Logia') b.classList.add('active-logia');
    }
  });
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = fruits.filter(f => {
    const matchType = currentFilter === 'all' || f.type.includes(currentFilter);
    const matchSearch = !q ||
      f.name.toLowerCase().includes(q) ||
      f.pt.toLowerCase().includes(q) ||
      f.user.toLowerCase().includes(q) ||
      f.desc.toLowerCase().includes(q) ||
      f.ability.toLowerCase().includes(q);
    return matchType && matchSearch;
  });

  document.getElementById('count').textContent =
    `${filtered.length} fruta${filtered.length !== 1 ? 's' : ''} encontrada${filtered.length !== 1 ? 's' : ''} nas archives`;

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">Nenhuma fruta encontrada nas archives do Grand Line…</div>';
    return;
  }

  grid.innerHTML = filtered.map((f, i) => `
    <div class="card ${typeClass(f.type)}"
         onclick="openModal(${fruits.indexOf(f)})"
         style="animation-delay:${i * 0.04}s"
         role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')openModal(${fruits.indexOf(f)})">
      <div class="card-top">
        <div class="fruit-icon">${f.icon}</div>
        <span class="type-badge">${typeLabel(f.type)}</span>
      </div>
      <div class="fruit-name">${f.name}</div>
      <div class="fruit-name-pt">${f.pt}</div>
      <div class="user-row">
        <span class="user-dot"></span>
        <span class="user-name">Usuário: <strong>${f.user.split('/')[0].trim()}</strong></span>
      </div>
      <div class="desc">${f.desc}</div>
    </div>
  `).join('');
}

function openModal(idx) {
  const f = fruits[idx];
  const tc = typeClass(f.type);
  const fillClass = tc + '-fill';
  const modal = document.getElementById('modal');

  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()" aria-label="Fechar">×</button>
    <div class="modal-icon">${f.icon}</div>
    <h2>${f.name}</h2>
    <div class="modal-pt">${f.pt}</div>
    <div class="modal-badge-row">
      <span class="type-badge ${tc}">${typeLabel(f.type)}</span>
    </div>

    <div class="divider"></div>

    <div class="modal-section">
      <div class="modal-label">Usuário(s) Conhecido(s)</div>
      <div class="modal-text">${f.user}</div>
    </div>

    <div class="modal-section">
      <div class="modal-label">Descrição</div>
      <div class="modal-text" style="font-style:italic;color:var(--muted)">${f.desc}</div>
    </div>

    <div class="modal-section">
      <div class="modal-label">Habilidade Detalhada</div>
      <div class="modal-text">${f.ability}</div>
    </div>

    <div class="divider"></div>

    <div class="modal-section">
      <div class="modal-label">Estatísticas de Poder</div>
      <div class="power-bar">
        ${Object.entries(f.powers).map(([k,v]) => `
          <div class="power-row">
            <div class="power-label">${k}</div>
            <div class="power-track">
              <div class="power-fill ${fillClass}" style="width:0%" data-target="${v}"></div>
            </div>
            <div class="power-value">${v}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-label">Fraquezas</div>
      <div style="margin-top:4px">
        ${f.weakness.map(w => `<span class="weakness-pill">${w}</span>`).join('')}
      </div>
    </div>
  `;

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Animate power bars after a brief delay
  setTimeout(() => {
    modal.querySelectorAll('.power-fill').forEach(bar => {
      bar.style.width = bar.dataset.target + '%';
    });
  }, 150);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if(e.target === document.getElementById('overlay')) closeModal();
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

// Initial render
render();
</script>
