<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enciclopédia das Frutas do Diabo – Grand Line Archives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="title-eyebrow">Grand Line Archives</div>
    <h1>Enciclopédia das<br>Frutas do Diabo</h1>
    <p class="subtitle">O conhecimento proibido do Grand Line</p>
  </header>

  <!-- ===== CONTROLES: BUSCA + FILTROS ===== -->
  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search" placeholder="Buscar fruta, usuário ou habilidade..." oninput="render()">
    </div>
    <div class="filters">
      <button class="filter-btn active-all" data-type="all"      onclick="setFilter('all')">Todas</button>
      <button class="filter-btn"            data-type="Paramecia" onclick="setFilter('Paramecia')">Paramecia</button>
      <button class="filter-btn"            data-type="Zoan"      onclick="setFilter('Zoan')">Zoan</button>
      <button class="filter-btn"            data-type="Logia"     onclick="setFilter('Logia')">Logia</button>
    </div>
  </div>

  <!-- ===== CONTADOR ===== -->
  <div class="count" id="count"></div>

  <!-- ===== GRID DE CARDS ===== -->
  <div class="grid" id="grid"></div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="overlay" onclick="closeModalOutside(event)">
    <div class="modal" id="modal"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
